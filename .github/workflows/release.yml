# Tag this repository (v1.0.0) and every map lands on the release as its own pack zip,
# which website-city publishes as gamemann/<map id>@<version>. The game imports the
# maps, so gs-ci checks game-fatal-contact out beside them and links maps/ in at its
# maps/imported, the path the .import markers were written against; see gs-ci's
# release-maps.yml.
name: Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    release:
        uses: gamespice-platform/ci/.github/workflows/release-maps.yml@v1.2.6
        permissions:
            contents: write
        with:
            game: zees-games/game-fatal-contact
        secrets:
            DEPS_TOKEN: ${{ secrets.GS_DEPS_TOKEN }}
